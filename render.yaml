services:
  - type: web
    name: telegram-shop-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: KEEPALIVE
        value: "1"
      - key: KEEPALIVE_SECONDS
        value: "540"
      - key: AUTO_SET_WEBHOOK
        value: "1"
      - key: BOT_HANDLER_THREADS
        value: "4"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: REQUIRED_CHANNEL_ID
        sync: false
      - key: REQUIRED_CHANNEL_USERNAME
        sync: false
      - key: CARD_NUMBER
        sync: false
      - key: CARD_HOLDER
        sync: false
      - key: ZARINPAL_MERCHANT_ID
        sync: false
      - key: ZARINPAL_CALLBACK_URL
        sync: false
