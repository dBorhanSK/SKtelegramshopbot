<!doctype html>
<html><head><meta charset="utf-8"><title>Shop Admin</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f8;color:#222}.wrap{max-width:1100px;margin:auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;padding:20px;border-radius:16px;box-shadow:0 2px 12px #0001}
button{padding:10px 16px;border:0;border-radius:10px;cursor:pointer}
</style></head><body><div class="wrap">
<h1>🛍 Shop Admin</h1>
<div class="grid">
<div class="card"><h3>Orders</h3><b>{{stats.orders}}</b></div>
<div class="card"><h3>Revenue</h3><b>{{stats.revenue}}</b></div>
<div class="card"><h3>Status</h3><b>Online</b></div>
</div>
<br><div class="card"><h2>Management</h2>
<p>Products, categories, users, coupons, orders and tickets are stored in Supabase.</p>
<p>API: <code>/admin/orders</code></p>
<form method="post" action="/admin/logout"><button>Logout</button></form></div>
</div></body></html>
